name: Build Nox Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-nox-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare NOX launcher icon
        working-directory: android-wrapper
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/res/drawable-nodpi/nox_icon_base64.txt > app/src/main/res/drawable-nodpi/ic_nox.jpg
          rm app/src/main/res/drawable-nodpi/nox_icon_base64.txt
          file app/src/main/res/drawable-nodpi/ic_nox.jpg
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nox-Android-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
