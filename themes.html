<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>الثيمات | ShadowBox Nox</title>
<link rel="stylesheet" href="style.css?v=20261019-compact-preworkout">
<style>
.theme-page{width:min(100%,760px);margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.theme-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.theme-top h1{font-size:24px;margin:0}
.theme-lead{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 18px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.theme-choice{--swatch:#e11d2e;display:block;width:100%;text-align:right;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);font:inherit}
.theme-choice[aria-pressed="true"]{border-color:var(--swatch);box-shadow:0 0 0 1px var(--swatch),0 8px 22px color-mix(in srgb,var(--swatch) 18%,transparent)}
.theme-preview{height:72px;border-radius:11px;margin-bottom:10px;background:linear-gradient(135deg,var(--swatch),#101010 78%);position:relative;overflow:hidden}
.theme-preview:after{content:"";position:absolute;inset:auto 10px 10px 10px;height:12px;border-radius:99px;background:var(--swatch);opacity:.75}
.theme-choice strong{display:block;font-size:15px}
.theme-choice small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
.theme-actions{display:flex;gap:10px;margin-top:18px}
.theme-actions a,.theme-actions button{flex:1;min-height:46px;display:grid;place-items:center;border-radius:12px;padding:10px;border:1px solid var(--line);text-decoration:none;font:inherit;font-weight:800}
.theme-actions .apply{background:var(--red);color:#fff;border-color:transparent}
@media(min-width:620px){.theme-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="theme-page">
<header class="theme-top"><a class="chip" href="index.html" aria-label="رجوع">رجوع</a><h1>🎨 اختر الثيم</h1></header>
<p class="theme-lead">اختر لونًا يغيّر هوية واجهة التطبيق. اختيارك يُحفظ على هذا الجهاز ويُطبّق عند العودة إلى ShadowBox Nox.</p>
<section class="theme-grid" aria-label="الثيمات">
<button class="theme-choice" style="--swatch:#e11d2e" data-theme="red" aria-pressed="false"><span class="theme-preview"></span><strong>الأحمر الكلاسيكي</strong><small>هوية ShadowBox الأصلية</small></button>
<button class="theme-choice" style="--swatch:#3b82f6" data-theme="blue" aria-pressed="false"><span class="theme-preview"></span><strong>الأزرق</strong><small>هادئ وواضح</small></button>
<button class="theme-choice" style="--swatch:#14b8a6" data-theme="green" aria-pressed="false"><span class="theme-preview"></span><strong>الأخضر</strong><small>لمسة منعشة</small></button>
<button class="theme-choice" style="--swatch:#a855f7" data-theme="purple" aria-pressed="false"><span class="theme-preview"></span><strong>البنفسجي</strong><small>طابع داكن مميز</small></button>
<button class="theme-choice" style="--swatch:#d4a017" data-theme="gold" aria-pressed="false"><span class="theme-preview"></span><strong>الذهبي</strong><small>لمسة معدنية</small></button>
</section>
<div class="theme-actions"><a href="index.html">إلغاء والعودة</a><button id="applyTheme" class="apply" type="button">تطبيق الثيم</button></div>
<p id="themeStatus" class="notice small" role="status" aria-live="polite">اختر ثيمًا ثم اضغط «تطبيق الثيم».</p>
</main>
<script>
(() => {
  const KEY = "shadowbox_prefs_v1";
  const allowed = ["red", "blue", "green", "purple", "gold"];
  let prefs = {};
  try { prefs = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch {}
  let selected = allowed.includes(prefs.theme) ? prefs.theme : "red";
  const choices = [...document.querySelectorAll("[data-theme]")];
  function previewTheme(theme) {
    selected = allowed.includes(theme) ? theme : "red";
    document.documentElement.dataset.theme = selected;
    choices.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.theme === selected)));
    document.getElementById("themeStatus").textContent = "الثيم المختار: " + ({red:"الأحمر الكلاسيكي",blue:"الأزرق",green:"الأخضر",purple:"البنفسجي",gold:"الذهبي"}[selected]);
  }
  choices.forEach(button => button.addEventListener("click", () => previewTheme(button.dataset.theme)));
  document.getElementById("applyTheme").addEventListener("click", () => {
    try {
      const latest = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
      latest.theme = selected;
      localStorage.setItem(KEY, JSON.stringify(latest));
      location.href = "index.html";
    } catch {
      document.getElementById("themeStatus").textContent = "تعذّر حفظ الاختيار. تأكد من أن المتصفح يسمح بالتخزين المحلي.";
    }
  });
  previewTheme(selected);
})();
</script>
</body>
</html>
